<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小蛋留言板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>小蛋留言板</h1>
            <p class="header-subtitle">随时吐槽 · 随时交流 · 一起进步</p>
        </header>

        <div class="control-bar">
            <div class="section-select">
                <select id="section-select" class="section-select">
                    <option value="全部">全部留言</option>
                    <option value="日常吐槽">日常吐槽</option>
                    <option value="搞笑搞怪">搞笑搞怪</option>
                    <option value="求助问答">求助问答</option>
                    <option value="灵感脑洞">灵感脑洞</option>
                </select>
            </div>

            <div class="control-buttons">
                <button id="reset-btn" class="btn reset-btn">清空数据</button>
                <button id="reset-demo-btn" class="btn reset-demo-btn">重置示例</button>
            </div>
        </div>

        <div class="form-card">
            <form id="comment-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <input type="text" id="nickname" placeholder="请输入你的昵称" required>
                        <div class="char-count" id="nickname-count">0/10</div>
                    </div>

                    <div class="form-group">
                        <label for="section">所属板块</label>
                        <select id="section" class="section-select">
                            <option value="日常吐槽">日常吐槽</option>
                            <option value="搞笑搞怪">搞笑搞怪</option>
                            <option value="求助问答">求助问答</option>
                            <option value="灵感脑洞">灵感脑洞</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="content">留言内容</label>
                    <textarea id="content" placeholder="写下你的看法吧..." rows="3" required></textarea>
                    <div class="char-count" id="content-count">0/200</div>
                </div>

                <button type="submit" class="btn submit-btn">发表留言</button>
            </form>
        </div>

        <div class="comments-list" id="comments-list"></div>

        <div class="empty-state" id="empty-state">
            <div class="empty-icon">📭</div>
            <p>还没有留言，快来发表第一条吧！</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
